<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Dobókocka Játék</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }
        #info-panel {
            text-align: center;
            margin-bottom: 40px;
            padding: 10px;
            z-index: 10;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #4ecc71;
        }
        .status {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-top: 5px;
        }
        /* 3D Kocka Alapok */
        .scene {
            width: 100px;
            height: 100px;
            margin: 40px auto;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(45deg);
            transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1);
        }
        .cube__face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #ffffff;
            border: 3px solid #333;
            border-radius: 15px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 10px;
            backface-visibility: hidden;
        }
        /* Pöttyök stílusa */
        .dot {
            background-color: #333;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            margin: auto;
        }
        /* Kockalapok elhelyezkedése a 3D térben */
        .cube__face--1 { transform: rotateY(  0deg) translateZ(50px); }
        .cube__face--6 { transform: rotateY(180deg) translateZ(50px); }
        .cube__face--3 { transform: rotateY( 90deg) translateZ(50px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(50px); }
        .cube__face--2 { transform: rotateX( 90deg) translateZ(50px); }
        .cube__face--5 { transform: rotateX(-90deg) translateZ(50px); }

        /* Pöttyök pontos pozíciói a lapokon (Grid) */
        .cube__face--1 .dot { grid-area: 2 / 2; }
        
        .cube__face--2 .dot:nth-child(1) { grid-area: 1 / 1; }
        .cube__face--2 .dot:nth-child(2) { grid-area: 3 / 3; }
        
        .cube__face--3 .dot:nth-child(1) { grid-area: 1 / 1; }
        .cube__face--3 .dot:nth-child(2) { grid-area: 2 / 2; }
        .cube__face--3 .dot:nth-child(3) { grid-area: 3 / 3; }
        
        .cube__face--4 .dot:nth-child(1) { grid-area: 1 / 1; }
        .cube__face--4 .dot:nth-child(2) { grid-area: 1 / 3; }
        .cube__face--4 .dot:nth-child(3) { grid-area: 3 / 1; }
        .cube__face--4 .dot:nth-child(4) { grid-area: 3 / 3; }
        
        .cube__face--5 .dot:nth-child(1) { grid-area: 1 / 1; }
        .cube__face--5 .dot:nth-child(2) { grid-area: 1 / 3; }
        .cube__face--5 .dot:nth-child(3) { grid-area: 2 / 2; }
        .cube__face--5 .dot:nth-child(4) { grid-area: 3 / 1; }
        .cube__face--5 .dot:nth-child(5) { grid-area: 3 / 3; }
        
        .cube__face--6 .dot:nth-child(1) { grid-area: 1 / 1; }
        .cube__face--6 .dot:nth-child(2) { grid-area: 1 / 3; }
        .cube__face--6 .dot:nth-child(3) { grid-area: 2 / 1; }
        .cube__face--6 .dot:nth-child(4) { grid-area: 2 / 3; }
        .cube__face--6 .dot:nth-child(5) { grid-area: 3 / 1; }
        .cube__face--6 .dot:nth-child(6) { grid-area: 3 / 3; }

        /* Indító Gomb */
        #start-btn {
            background-color: #4ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(78, 204, 113, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            z-index: 10;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="info-panel">
        <h1>Rázós Dobókocka</h1>
        <p>Nyomd meg az indítást az engedélyekhez!</p>
        <div class="status" id="wake-status">Ébren tartás: Kikapcsolva</div>
        <div class="status" id="motion-status">Mozgásérzékelő: Kikapcsolva</div>
    </div>

    <!-- Kocka leképezése -->
    <div class="scene" id="cube-scene">
        <div class="cube" id="cube">
            <div class="cube__face cube__face--1"><div class="dot"></div></div>
            <div class="cube__face cube__face--2"><div class="dot"></div><div class="dot"></div></div>
            <div class="cube__face cube__face--3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cube__face cube__face--4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cube__face cube__face--5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="cube__face cube__face--6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
    </div>

    <button id="start-btn">Játék Indítása</button>

    <script>
        const cube = document.getElementById('cube');
        const startBtn = document.getElementById('start-btn');
        const wakeStatus = document.getElementById('wake-status');
        const motionStatus = document.getElementById('motion-status');

        let wakeLock = null;
        let isRolling = false;

        // Kocka forgatási szögek a kapott számok szerint
        const faceRotations = {
            1: { x: 0, y: 0 },
            6: { x: 0, y: 180 },
            3: { x: 0, y: -90 },
            4: { x: 0, y: 90 },
            2: { x: -90, y: 0 },
            5: { x: 90, y: 0 }
        };

        // Kockadobás funkció
        function rollDice() {
            if (isRolling) return;
            isRolling = true;
        
            const result = Math.floor(Math.random() * 6) + 1;
            
            // DRÁMAI HATÁS: Megnöveltük a fordulatokat (360 fok helyett akár 4-5 teljes kört is pördül)
            // Most már a Z tengelyt (csavarás) is vadul pörgetjük, így nem csak az oldalán forog!
            const extraX = (Math.floor(Math.random() * 3) + 4) * 360; // 4-6 teljes fordulat X tengelyen
            const extraY = (Math.floor(Math.random() * 3) + 4) * 360; // 4-6 teljes fordulat Y tengelyen
            const extraZ = (Math.floor(Math.random() * 4) + 2) * 360; // 2-5 teljes fordulat Z tengelyen (bukdácsolás)
        
            // A kiválasztott lap alaphelyzete + a rengeteg extra pörgés mindhárom tengelyen
            const targetX = faceRotations[result].x + extraX;
            const targetY = faceRotations[result].y + extraY;
            const targetZ = extraZ; // A Z tengelyen mindegy hol áll meg, mert a lapok helyzetét az X és Y határozza meg
        
            // Mindhárom tengely forgatását átadjuk a CSS-nek egyszerre
            cube.style.transform = `rotateX(${targetX}deg) rotateY(${targetY}deg) rotateZ(${targetZ}deg)`;
        
            setTimeout(() => {
                isRolling = false;
            }, 1500); // 1.5 másodpercig tart a kaotikus pörgés
        }

        // Képernyő ébren tartásának kérése
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeStatus.textContent = "Ébren tartás: AKTÍV 🔓";
                    wakeStatus.style.color = "#4ecc71";
                } catch (err) {
                    wakeStatus.textContent = `Ébren tartás hiba: ${err.message}`;
                    wakeStatus.style.color = "#e74c3c";
                }
            } else {
                wakeStatus.textContent = "Ébren tartás: Nem támogatott böngésző";
                wakeStatus.style.color = "#f39c12";
            }
        }

        // Gyorsulásmérő kezelése
        let lastX = null, lastY = null, lastZ = null;
        const threshold = 12; // rázási érzékenység határértéke

        function handleMotion(event) {
            // Egyes újabb Androidokon és iOS-en az event.acceleration-t kell használni, ha az IncludingGravity nem megy
            const acc = event.acceleration || event.accelerationIncludingGravity;
            if (!acc || acc.x === null || acc.y === null || acc.z === null) return;
        
            if (lastX !== null) {
                let deltaX = Math.abs(acc.x - lastX);
                let deltaY = Math.abs(acc.y - lastY);
                let deltaZ = Math.abs(acc.z - lastZ);
        
                // Lejjebb vettem a küszöböt 12-re, hogy kisebb rázásra is azonnal beugorjon
                const currentThreshold = 12; 
        
                // Ha bármelyik tengelyen hirtelen megmozdul a telefon
                if (deltaX > currentThreshold || deltaY > currentThreshold || deltaZ > currentThreshold) {
                    rollDice();
                }
            }
        
            lastX = acc.x;
            lastY = acc.y;
            lastZ = acc.z;
        }

        // Mozgásérzékelő aktiválása engedéllyel
        function initMotion() {
            // Ellenőrizzük, hogy az iOS-es engedélykérő funkció létezik-e
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            motionStatus.textContent = "Mozgásérzékelő: AKTÍV 📳";
                            motionStatus.style.color = "#4ecc71";
                        } else {
                            motionStatus.textContent = "Mozgásérzékelő: Letiltva a telefonodon";
                            motionStatus.style.color = "#e74c3c";
                            alert("Kérlek, engedélyezd a mozgásérzékelőt a játékhoz!");
                        }
                    })
                    .catch(err => {
                        motionStatus.textContent = "Szenzor hiba";
                        alert("Hiba történt: " + err.message);
                    });
            } else {
                // Android, PC vagy Mac böngészők (itt nem kötelező a felugró engedélyablak)
                window.addEventListener('devicemotion', handleMotion);
                motionStatus.textContent = "Mozgásérzékelő: AKTÍV";
                motionStatus.style.color = "#4ecc71";
            }
        }
        // Kattintásra is lehessen dobni (gépi teszthez vagy ha nem rázzák)
        document.getElementById('cube-scene').addEventListener('click', rollDice);
        // FŐ INDÍTÓ ESEMÉNY (Felhasználói interakció szükséges a böngészők miatt)
        startBtn.addEventListener('click', () => {
            requestWakeLock();
            initMotion();
            rollDice(); // Egy kezdő dobás
            startBtn.style.display = 'none'; // Elrejtjük a gombot az indítás után
        });
        // Ha a felhasználó háttérbe rakja a böngészőt, majd visszatér, a Wake Lock-ot újra kell kérni
        document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });
    </script>
</body>
</html>
